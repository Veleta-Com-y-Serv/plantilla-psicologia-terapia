      - { nombre: Iker Zubizarreta, cargo: "Psicólogo sanitario · Pareja y adolescentes", foto: /placeholders/persona.svg, texto: "Terapia sistémica y de pareja. Coordina el grupo de mindfulness." }
      - { nombre: Ane Olaizola, cargo: "Logopeda · Infancia", foto: /placeholders/persona.svg, texto: "Lenguaje, habla y lectoescritura, siempre de la mano de la familia." }

