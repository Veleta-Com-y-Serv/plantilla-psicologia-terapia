    antetitulo: Quiénes somos
    titulo: Tres profesionales, una misma forma de escuchar
    declaracion: "Escuchamos primero y proponemos después."
    texto: |
      Abrimos Lur en 2019 en un piso luminoso del Centro, con la idea de que ir a terapia se parezca más a una buena conversación que a una cita médica.

      Trabajamos con terapia cognitivo-conductual y con herramientas de tercera generación, como la aceptación y el compromiso o la atención plena. Nos adaptamos a cada persona: hay quien necesita pautas concretas y quien necesita, sobre todo, tiempo para ordenar lo que siente.

      Atendemos en castellano y en euskera, en la consulta o por videollamada.
